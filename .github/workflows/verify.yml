name: Verify debug APK

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up cached Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
      - name: Check preinstalled Android SDK components
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          printf 'Android SDK: %s; platform 36 and build-tools 35.0.0 present\n' "$ANDROID_HOME"
      - name: Verify core safety and tests
        run: ./gradlew -p core check --console=plain
      - name: Verify debug app and both merged manifests
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:verifyNoForbiddenPermissions :app:assembleDebug --console=plain
      - name: Verify APK identity and record checksum
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          printf 'Source SHA: %s\n' "$(git rev-parse HEAD)"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -F "package: name='io.github.eternalliquet.bamboobd2' versionCode='2' versionName='0.1.0-nightly.20261029'"
          printf '%s\n' "$badging" | grep -Fx "sdkVersion:'26'"
          printf '%s\n' "$badging" | grep -Fx "targetSdkVersion:'36'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          sha256sum "$apk"
      - name: Upload APK from the checked source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
